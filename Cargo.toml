[package]
name = "codcel-postgresql-engine"
version = "0.1.9"
edition = "2021"
rust-version = "1.94"
authors = ["Codcel <support@codcel.io>"]
description = "Excel lookups in Rust with full CRUD over PostgreSQL via sqlx: prepared-statement writes, pooled connections, tables bootstrapped from Parquet schemas. Part of Codcel (codcel.io): Excel in, real code out."
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/codcel-io/codcel-postgresql-engine"
homepage = "https://codcel.io"
keywords = ["excel", "spreadsheet", "postgres", "postgresql", "sqlx"]
categories = ["database", "asynchronous"]
include = [
    "src/**/*.rs",
    "README.md",
    "CONTRIBUTING.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
]

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
codcel-calculation-engine = "0.1.9"
codcel-table-engine = "0.1.9"
async-trait = "0.1.91"
datafusion = "54.1.0"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres"] }
anyhow = "1.0.104"
chrono = "0.4.45"
uuid = { version = "1.24.0", features = ["v4"] }
whoami = "2.1.2"
log = "0.4.33"
futures = "0.3.33"
